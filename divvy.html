                    const now = new Date().toISOString();
                    const demoExpenses = [
                        { id: generateId(), payer: 'Alex', amount: 180, description: 'Airbnb (2 nights)', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000), lastModified: now, deleted: false },
                        { id: generateId(), payer: 'Jordan', amount: 65, description: 'Grocery run', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 2.5 * 24 * 60 * 60 * 1000), lastModified: now, deleted: false },
                        { id: generateId(), payer: 'Sam', amount: 120, description: 'Surf board rentals', beneficiaries: ['Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000), lastModified: now, deleted: false },
                        { id: generateId(), payer: 'Riley', amount: 85, description: 'Seafood dinner', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 1.5 * 24 * 60 * 60 * 1000), lastModified: now, deleted: false },
                        { id: generateId(), payer: 'Alex', amount: 40, description: 'Beach bonfire supplies', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000), lastModified: now, deleted: false },
                        { id: generateId(), payer: 'Morgan', amount: 55, description: 'Breakfast & coffee', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 0.5 * 24 * 60 * 60 * 1000), lastModified: now, deleted: false },
                        { id: generateId(), payer: 'Jordan', amount: 30, description: 'Gas money', beneficiaries: ['Alex', 'Jordan', 'Riley'], date: new Date(), lastModified: now, deleted: false },
                    ];
                    await db.expenses.bulkAdd(demoExpenses);
                    await db.strangers.add({ pair: 'Jordan|Morgan' });

                    localStorage.removeItem('divvy_user_reset');
                    span.end({ participants: defaults.length, expenses: demoExpenses.length });
                    T.info('app', '📦 Demo data loaded, reloading page...');
                    window.location.reload();
                } catch (err) {
                    span.error(err);
                    T.error('database', 'Failed to load demo data', { error: err.message });
                    alert('Failed to load demo data');
                }
            };

            const submitExpense = async () => {
                const val = parseFloat(amount);
                if (!payer || isNaN(val) || val <= 0 || selectedBeneficiaries.size === 0) {
                    T.warn('expense', 'Invalid expense submission', { payer, amount, beneficiaries: selectedBeneficiaries.size });
                    return;
                }

                T.interaction('submitExpense', description || 'Untitled');
                const span = T.startSpan('submitExpense', 'expense');

                const newExpense = {
                    id: generateId(),
                    payer,
                    amount: val,
                    description: description || 'Untitled',
                    beneficiaries: Array.from(selectedBeneficiaries),
                    date: new Date(),
                    lastModified: new Date().toISOString(),
                    deleted: false
                };

                try {
                    await db.expenses.add(newExpense);
                    setExpenses(prev => [newExpense, ...prev]);
                    setAmount('');
                    setDescription('');
                    setViewMode('history');
                    span.end({ id: newExpense.id, amount: val, payer, beneficiaries: newExpense.beneficiaries.length });
                    T.info('expense', `💰 New expense: ${formatMoney(val)} by ${payer}`, { description: newExpense.description });
                } catch (err) {
                    span.error(err);
                }
            };


            // --- IMPORT / EXPORT LOGIC ---

            const downloadTSV = () => {
                T.interaction('downloadTSV', 'export');
                const span = T.startSpan('downloadTSV', 'export');

                // Section 1: Expense History (Readable)
                // Added ISO_TIMESTAMP and ID columns for robust restoration
                let tsv = "EXPENSE HISTORY\n";
                tsv += "Date\tDescription\tPayer\tAmount\tBeneficiaries\tISO_Timestamp\tID\n";

                visibleExpenses.forEach(exp => {
                    const dateStr = `${formatDate(exp.date)} ${formatTime(exp.date)}`;
                    const cleanDesc = exp.description.replace(/[\t\n]/g, " ");
                    const benStr = exp.beneficiaries.join(", ");
                    const isoDate = exp.date.toISOString();
                    tsv += `${dateStr}\t${cleanDesc}\t${exp.payer}\t${exp.amount.toFixed(2)}\t${benStr}\t${isoDate}\t${exp.id}\n`;
                });

                tsv += `\nTOTAL SPENT\t${totalSpent.toFixed(2)}\n\n`;

                // Section 2: Participants Dump
                tsv += "PARTICIPANTS_DATA\n";
                tsv += "Name\n";
                participants.forEach(p => tsv += `${p}\n`);
                tsv += "\n";

                // Section 3: Strangers Dump
                tsv += "STRANGERS_DATA\n";
                tsv += "Pair\n";
                strangers.forEach(s => tsv += `${s}\n`);
                tsv += "\n";

                // Section 4: Calculated Plan (For Human Reading Only)
                tsv += "OPTIMIZED SETTLEMENT PLAN\n";
                tsv += "From\tTo\tAmount\tRelationship\n";

                settlementPlan.forEach(plan => {
                    const type = plan.isStranger ? "Stranger Path" : "Direct";
                    tsv += `${plan.from}\t${plan.to}\t${plan.amount.toFixed(2)}\t${type}\n`;
                });

                const blob = new Blob([tsv], { type: "text/tab-separated-values" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `trip_backup_${new Date().toISOString().slice(0, 10)}.tsv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                span.end({ expenses: expenses.length, participants: participants.length, strangers: strangers.size });
                T.info('export', '📤 TSV backup downloaded', { filename: a.download });
            };

            const triggerImport = () => {
                T.interaction('triggerImport', 'import');
                fileInputRef.current?.click();
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                T.interaction('handleFileUpload', file.name);
                const span = T.startSpan('handleFileUpload', 'import');

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    span.log('debug', `Parsing ${lines.length} lines from ${file.name}`);

                    let section = 'UNKNOWN';
                    const newExpenses = [];
                    const newParticipants = new Set();
                    const newStrangers = new Set();

                    for (let line of lines) {
                        line = line.trim();
                        if (!line) continue;

                        if (line.startsWith('EXPENSE HISTORY')) { section = 'EXPENSES'; continue; }
                        if (line.startsWith('PARTICIPANTS_DATA')) { section = 'PARTICIPANTS'; continue; }
                        if (line.startsWith('STRANGERS_DATA')) { section = 'STRANGERS'; continue; }
                        if (line.startsWith('OPTIMIZED SETTLEMENT PLAN')) { section = 'PLAN'; continue; }
                        if (line.startsWith('TOTAL SPENT')) continue;

                        // Skip headers
                        if (line.startsWith('Date\t') || line.startsWith('Name') || line.startsWith('Pair') || line.startsWith('From\t')) continue;

                        const cols = line.split('\t');

                        if (section === 'EXPENSES' && cols.length >= 4) {
                            const amount = parseFloat(cols[3]);
                            if (!isNaN(amount)) {
                                const isoDate = cols[5];
                                const date = isoDate ? new Date(isoDate) : new Date();
                                const beneficiaries = cols[4] ? cols[4].split(', ') : [];

                                newExpenses.push({
                                    id: cols[6] || generateId(),
                                    date,
                                    description: cols[1] || 'Imported Expense',
                                    payer: cols[2],
                                    amount,
                                    beneficiaries
                                });
                                newParticipants.add(cols[2]);
                                beneficiaries.forEach(b => newParticipants.add(b));
                            }
                        } else if (section === 'PARTICIPANTS') {
                            newParticipants.add(line);
                        } else if (section === 'STRANGERS') {
                            newStrangers.add(line);
                        }
                    }

                    span.log('info', 'Parsed data', {
                        expenses: newExpenses.length,
                        participants: newParticipants.size,
                        strangers: newStrangers.size
                    });

                    // Atomic Update
                    try {
                        await db.transaction('rw', db.participants, db.expenses, db.strangers, async () => {
                            await db.participants.clear();
                            await db.expenses.clear();
                            await db.strangers.clear();

                            const sortedParticipants = Array.from(newParticipants).sort();
                            await db.participants.bulkAdd(sortedParticipants.map(name => ({ name })));

                            await db.expenses.bulkAdd(newExpenses);

                            const strangerArr = Array.from(newStrangers).map(pair => ({ pair }));
                            if (strangerArr.length > 0) await db.strangers.bulkAdd(strangerArr);
                        });

                        span.end({ success: true, expenses: newExpenses.length, participants: newParticipants.size });
                        T.info('import', '📥 State restored successfully!', { filename: file.name });

                        loadDataFromDB();
                        alert('State successfully restored!');
                    } catch (err) {
                        span.error(err);
                        T.error('import', 'Failed to restore state', { error: err.message });
                        alert('Failed to restore state. Check file format.');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };


            if (isLoading) {
                return (
                    <div className="h-screen w-full flex flex-col items-center justify-center bg-background-light dark:bg-background-dark text-slate-500">
                        <Icon name="sync" className="animate-spin text-4xl mb-4 text-primary" />
                        <p className="font-medium">Loading your trip data...</p>
                    </div>
                );
            }

            return (
                <>
                    {/* Reset Confirmation Modal */}
                    {/* Join Trip Modal */}
                    {showJoinTripModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-[#1a2e22] rounded-2xl p-6 max-w-md mx-4 shadow-2xl border border-slate-200 dark:border-white/10">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="p-3 bg-primary/10 dark:bg-primary/20 rounded-full">
                                        <Icon name="group_add" className="text-primary text-2xl" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-text-main dark:text-white">Join a Shared Trip</h3>
                                        <p className="text-sm text-slate-500">Someone shared a trip with you</p>
                                    </div>
                                </div>
                                <p className="text-slate-600 dark:text-slate-300 mb-4">
                                    Connect to this shared Google Sheet to sync expenses with your group. {!googleUser && 'You\'ll need to sign in with Google first.'}
                                </p>
                                {sheetId && (
                                    <p className="text-sm text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 p-3 rounded-lg mb-4">
                                        You're currently connected to a different trip. Joining this one will replace your connection.
                                    </p>
                                )}
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => { setShowJoinTripModal(false); setIncomingSheetId(null); }}
                                        className="flex-1 py-3 px-4 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-700 dark:text-slate-300 font-bold rounded-xl transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => { if (!googleUser) { googleSignIn(); } joinTrip(); }}
                                        className="flex-1 py-3 px-4 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2"
                                    >
                                        <Icon name="link" className="text-[18px]" />
                                        Connect
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showResetConfirm && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-[#1a2e22] rounded-2xl p-6 max-w-md mx-4 shadow-2xl border border-slate-200 dark:border-white/10">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="p-3 bg-red-100 dark:bg-red-900/30 rounded-full">
                                        <Icon name="warning" className="text-red-500 text-2xl" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-text-main dark:text-white">Start New Trip?</h3>
                                        <p className="text-sm text-slate-500">This action cannot be undone</p>
                                    </div>
                                </div>
                                <p className="text-slate-600 dark:text-slate-300 mb-6">
                                    All participants, expenses, and relationships will be permanently deleted. Consider downloading a backup first.
                                </p>
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setShowResetConfirm(false)}
                                        className="flex-1 py-3 px-4 bg-slate-100 dark:bg-white/10 hover:bg-slate-200 dark:hover:bg-white/20 text-slate-700 dark:text-slate-300 font-bold rounded-xl transition-colors"
                                    >
                                        Cancel

                                    <button
                                        onClick={resetTrip}

                                        <Icon name="delete_forever" className="text-[18px]" />

                                </div>
                            </div>
                        </div>
                    )}

                    {/* Benefits Modal */}
                    {showBenefitsModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-[#1a2e22] rounded-2xl p-6 max-w-xl mx-4 shadow-2xl border border-slate-200 dark:border-white/10 max-h-[90vh] overflow-y-auto">
                                {/* Header */}
                                <div className="flex items-start gap-4 mb-6">
                                    <div className="p-3 bg-primary/10 dark:bg-primary/20 rounded-full flex-shrink-0">
                                        <Icon name="lightbulb" className="text-primary text-2xl" filled />
                                    </div>
                                    <div className="flex-1 pr-4">
                                        <h2 className="text-2xl font-bold text-text-main dark:text-white mb-1">
                                            Welcome to Divvy
                                        </h2>
                                        <p className="text-sm text-slate-600 dark:text-slate-400">
                                            Smart expense splitting for group trips
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setShowBenefitsModal(false)}
                                        className="flex-shrink-0 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"
                                    >
                                        <Icon name="close" />
                                    </button>
                                </div>

                                {/* Benefits List */}
                                <div className="space-y-2 mb-6">
                                    <BenefitItem
                                        icon="trending_down"
                                        title="Minimize Payments"
                                        description="Settle debts in fewer transactions using linear programming"
                                    />
                                    <BenefitItem
                                        icon="people"
                                        title="Handle Awkward Moments"
                                        description="Mark strangers who haven't met — payments route through mutual friends"
                                    />
                                    <BenefitItem
                                        icon="cloud_off"
                                        title="Works Offline"
                                        description="All data stored locally in your browser, no account needed"
                                    />
                                    <BenefitItem
                                        icon="download"
                                        title="Backup & Restore"
                                        description="Download TSV backups and restore anytime"
                                    />
                                </div>

                                {/* CTA Button */}
                                <button
                                    onClick={() => setShowBenefitsModal(false)}
                                    className="w-full py-3 bg-primary hover:bg-primary-dark text-text-main font-bold rounded-xl transition-colors"
                                >
                                    Let's Go
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="sticky top-0 z-50 flex items-center justify-between whitespace-nowrap border-b border-solid border-[#dce5df] dark:border-white/10 px-4 sm:px-8 py-3 sm:py-4 bg-white dark:bg-[#1a2e22] shadow-sm">
                        <div className="flex items-center gap-3 sm:gap-4 cursor-pointer group transition-opacity hover:opacity-80 min-w-0" onClick={() => setShowBenefitsModal(true)} title="Click to see features">
                            <div className="size-9 sm:size-10 bg-primary/20 group-hover:bg-primary/30 rounded-xl flex items-center justify-center text-primary-dark dark:text-primary transition-colors flex-shrink-0">
                                <img src="icons/divvy-icon.svg" alt="Divvy" className="w-full h-full object-contain" />
                            </div>
                            <div className="min-w-0">
                                <h1 className="text-base sm:text-lg font-bold leading-tight tracking-tight text-text-main dark:text-white">Divvy</h1>
                                <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium hidden sm:block">Settle up in fewer payments, not more drama</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 sm:gap-4 flex-shrink-0">
                            <div className="hidden md:flex flex-col items-end">
                                <span className="text-xs uppercase tracking-wider font-bold text-slate-400">Total Spent</span>
                                <span className="text-2xl font-bold text-[#111814] dark:text-white">{formatMoney(totalSpent)}</span>
                            </div>

                            {/* Google Sheets Sync Buttons */}
                            {!googleUser ? (
                                <button
                                    onClick={googleSignIn}
                                    className="flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-2 bg-white dark:bg-white/10 hover:bg-slate-50 dark:hover:bg-white/20 border border-slate-200 dark:border-white/20 rounded-lg transition-colors text-sm font-medium text-slate-600 dark:text-slate-300"
                                    title="Sign in with Google to sync & share"
                                >
                                    <Icon name="cloud_off" className="text-[18px]" />
                                    <span className="hidden sm:inline">Sign In</span>
                                </button>
                            ) : (
                                <>
                                    {!sheetId ? (
                                        <button
                                            onClick={createAndShareTrip}
                                            className="flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-2 bg-primary/10 hover:bg-primary/20 border border-primary/30 rounded-lg transition-colors text-sm font-medium text-primary-dark dark:text-primary"
                                            title="Create a Google Sheet to share this trip"
                                        >
                                            <Icon name="add_link" className="text-[18px]" />
                                            <span className="hidden sm:inline">Share Trip</span>
                                        </button>
                                    ) : (
                                        <>
                                            <button
                                                onClick={syncWithSheet}
                                                disabled={syncStatus === 'syncing'}
                                                className={`flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-2 rounded-lg transition-colors text-sm font-medium border ${
                                                    syncStatus === 'error'
                                                        ? 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800 text-red-600 dark:text-red-400'
                                                        : syncStatus === 'success'
                                                        ? 'bg-green-50 dark:bg-green-900/20 border-green-200 dark:border-green-800 text-green-600 dark:text-green-400'
                                                        : 'bg-white dark:bg-white/10 border-slate-200 dark:border-white/20 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-white/20'
                                                }`}
                                                title={getSyncLabel()}
                                            >
                                                <Icon name={syncStatus === 'syncing' ? 'sync' : syncStatus === 'error' ? 'sync_problem' : syncStatus === 'success' ? 'cloud_done' : 'cloud_sync'} className={`text-[18px] ${syncStatus === 'syncing' ? 'animate-spin' : ''}`} />
                                                <span className="hidden sm:inline">{getSyncLabel()}</span>
                                            </button>
                                            <button
                                                onClick={shareTrip}
                                                className="flex items-center gap-1 sm:gap-2 px-2 sm:px-3 py-2 bg-primary/10 hover:bg-primary/20 border border-primary/30 rounded-lg transition-colors text-sm font-medium text-primary-dark dark:text-primary"
                                                title="Share trip link with friends"
                                            >
                                                <Icon name="share" className="text-[18px]" />
                                                <span className="hidden sm:inline">Share</span>
                                            </button>
                                        </>
                                    )}
                                    <button
                                        onClick={googleSignOut}
                                        className="flex items-center justify-center size-8 rounded-full overflow-hidden border-2 border-primary/30 hover:border-primary transition-colors"
                                        title={`${googleUser.email} — Click to sign out`}
                                    >
                                        {googleUser.picture ? (
                                            <img src={googleUser.picture} alt="" className="size-full object-cover" referrerPolicy="no-referrer" />
                                        ) : (
                                            <span className="text-xs font-bold text-primary-dark dark:text-primary">{googleUser.name?.[0] || '?'}</span>
                                        )}
                                    </button>
                                </>
                            )}

                            <button
                                onClick={() => setShowResetConfirm(true)}
                                className="flex items-center gap-1 sm:gap-2 px-2 sm:px-4 py-2 bg-slate-100 dark:bg-white/10 hover:bg-red-50 dark:hover:bg-red-900/20 text-slate-600 dark:text-slate-300 hover:text-red-600 dark:hover:text-red-400 rounded-lg transition-colors text-sm font-medium"
                            >
                                <Icon name="restart_alt" className="text-[18px]" />
                                <span className="hidden sm:inline">New Trip</span>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1">
                        <div className="w-full max-w-[1600px] mx-auto px-3 py-4 sm:p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 items-start">

                            {/* --- Left Column (4) --- */}
                            {normalizedSectionOrder.left.length > 0 && (
                                <div ref={leftColumnRef} className="sortable-container lg:col-span-4 flex flex-col gap-6">
                                    {normalizedSectionOrder.left.map(sectionId => renderSection(sectionId))}
                                </div>
                            )}

                            {/* --- Center Column (5) --- */}
                            {normalizedSectionOrder.center.length > 0 && (
                                <div ref={centerColumnRef} className="sortable-container lg:col-span-5 flex flex-col min-h-[400px]">
                                    {normalizedSectionOrder.center.map(sectionId => renderSection(sectionId))}
                                </div>
                            )}

                            {/* --- Right Column (3) --- */}
                            {normalizedSectionOrder.right.length > 0 && (
                                <div ref={rightColumnRef} className="sortable-container lg:col-span-3 flex flex-col gap-6">
                                    {normalizedSectionOrder.right.map(sectionId => renderSection(sectionId))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="py-4 px-4 sm:px-8 border-t border-[#dce5df] dark:border-white/10 bg-white dark:bg-[#1a2e22]">
                        <div className="flex items-center justify-center gap-2">
                            <picture>
                                <source srcSet="images/made-with-example.webp" type="image/webp" />
                                <img
                                    src="images/made-with-example.png"
                                    alt="Snoopy"
                                    width="32"
                                    height="32"
                                    className="h-8 w-auto"
                                />
                            </picture>
                            <span className="text-sm text-slate-500 dark:text-slate-400">Made with</span>
                            <Icon name="favorite" className="text-red-500 text-[18px]" filled />
                            <span className="text-sm text-slate-500 dark:text-slate-400">by Hunar</span>
                        </div>
                    </footer>
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>

</html>
