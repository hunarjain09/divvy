<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Divvy - Smart Group Expense Splitting</title>

    <!-- iOS Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Divvy">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- LP Solver -->
    <script src="https://unpkg.com/javascript-lp-solver@0.4.24/prod/solver.js"></script>
    
    <!-- Dexie.js (IndexedDB Wrapper) -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
            }
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e87a",
                        "primary-dark": "#25b860",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112117",
                        "slate-dark": "#1e293b",
                        "slate-light": "#f8fafc",
                        "text-main": "#111814"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "1.5rem", "xl": "2rem", "2xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Tooltip styles */
        .tooltip-trigger:hover .tooltip-content {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -10px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111814] dark:text-white min-h-screen flex flex-col font-display lg:overflow-hidden overflow-y-auto">
    <div id="root" class="lg:h-full h-auto flex flex-col flex-1 lg:overflow-hidden overflow-visible"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        // --- Dexie Database Setup ---
        const db = new Dexie('TripExpenseDB');
        db.version(1).stores({
            participants: '&name', // Unique name
            expenses: '++id, date', // Auto-increment ID
            strangers: '&pair' // Unique pair string "NameA|NameB"
        });

        // --- Helpers ---
        const AVATAR_COLORS = [
            { bg: 'bg-indigo-100', text: 'text-indigo-600' },
            { bg: 'bg-pink-100', text: 'text-pink-600' },
            { bg: 'bg-blue-100', text: 'text-blue-600' },
            { bg: 'bg-orange-100', text: 'text-orange-600' },
            { bg: 'bg-emerald-100', text: 'text-emerald-600' },
            { bg: 'bg-purple-100', text: 'text-purple-600' },
        ];

        const getAvatarColor = (name) => {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const index = Math.abs(hash) % AVATAR_COLORS.length;
            return AVATAR_COLORS[index];
        };

        const Icon = ({ name, className = "", filled = false }) => (
            <span className={`material-symbols-outlined ${filled ? 'fill' : ''} ${className}`}>
                {name}
            </span>
        );

        const Tooltip = ({ text, children }) => {
            const [show, setShow] = useState(false);
            const [pos, setPos] = useState({ top: 0, left: 0 });
            const triggerRef = useRef(null);

            const handleMouseEnter = () => {
                if (triggerRef.current) {
                    const rect = triggerRef.current.getBoundingClientRect();
                    setPos({
                        top: rect.top - 8,
                        left: rect.left + rect.width / 2
                    });
                }
                setShow(true);
            };

            return (
                <div
                    className="relative inline-block"
                    ref={triggerRef}
                    onMouseEnter={handleMouseEnter}
                    onMouseLeave={() => setShow(false)}
                >
                    {children}
                    {show && (
                        <div
                            className="fixed px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap z-[9999] pointer-events-none -translate-x-1/2 -translate-y-full"
                            style={{ top: pos.top, left: pos.left }}
                        >
                            {text}
                            <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-800"></div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main Component ---
        const App = () => {
            // State
            const [isLoading, setIsLoading] = useState(true);
            const [participants, setParticipants] = useState([]);
            const [newParticipant, setNewParticipant] = useState('');
            const [strangers, setStrangers] = useState(new Set()); // "Name1|Name2"
            const [showRelationshipManager, setShowRelationshipManager] = useState(false);
            const [strangerA, setStrangerA] = useState('');
            const [strangerB, setStrangerB] = useState('');
            
            // Log Expense State
            const [viewMode, setViewMode] = useState('log'); // 'log' | 'history'
            const [expenses, setExpenses] = useState([]);
            const [payer, setPayer] = useState('');
            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [selectedBeneficiaries, setSelectedBeneficiaries] = useState(new Set());

            // Solver
            const [isSolverLoaded, setIsSolverLoaded] = useState(false);
            
            // File Input Ref
            const fileInputRef = useRef(null);

            // Reset confirmation modal
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            useEffect(() => {
                if (typeof window.solver !== 'undefined') setIsSolverLoaded(true);
                else {
                    const i = setInterval(() => {
                        if (typeof window.solver !== 'undefined') {
                            setIsSolverLoaded(true);
                            clearInterval(i);
                        }
                    }, 200);
                    return () => clearInterval(i);
                }
            }, []);

            // --- Database Loader ---
            const loadDataFromDB = async () => {
                try {
                    const pCount = await db.participants.count();
                    const userHasReset = localStorage.getItem('divvy_user_reset') === 'true';

                    // Only add demo data if DB is empty AND user hasn't explicitly reset
                    if (pCount === 0 && !userHasReset) {
                        // Demo: Beach Weekend Trip with Friends
                        const defaults = ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'];
                        await db.participants.bulkAdd(defaults.map(name => ({ name })));

                        // Demo expenses - a realistic beach trip
                        const demoExpenses = [
                            { payer: 'Alex', amount: 180, description: 'Airbnb (2 nights)', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000) },
                            { payer: 'Jordan', amount: 65, description: 'Grocery run', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 2.5 * 24 * 60 * 60 * 1000) },
                            { payer: 'Sam', amount: 120, description: 'Surf board rentals', beneficiaries: ['Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000) },
                            { payer: 'Riley', amount: 85, description: 'Seafood dinner', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 1.5 * 24 * 60 * 60 * 1000) },
                            { payer: 'Alex', amount: 40, description: 'Beach bonfire supplies', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000) },
                            { payer: 'Morgan', amount: 55, description: 'Breakfast & coffee', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 0.5 * 24 * 60 * 60 * 1000) },
                            { payer: 'Jordan', amount: 30, description: 'Gas money', beneficiaries: ['Alex', 'Jordan', 'Riley'], date: new Date() },
                        ];
                        await db.expenses.bulkAdd(demoExpenses);

                        // Demo stranger relationship - Jordan and Morgan met through different friend groups
                        await db.strangers.add({ pair: 'Jordan|Morgan' });
                    }

                    const ps = await db.participants.toArray();
                    const pNames = ps.map(p => p.name);
                    setParticipants(pNames);

                    if (!payer && pNames.length > 0) setPayer(pNames[0]);
                    setSelectedBeneficiaries(new Set(pNames));

                    const exps = await db.expenses.toArray();
                    setExpenses(exps.sort((a,b) => b.date - a.date));

                    const strs = await db.strangers.toArray();
                    setStrangers(new Set(strs.map(s => s.pair)));

                } catch (err) {
                    console.error("Failed to load DB:", err);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromDB();
            }, []);

            // Logic: Balance Calculation (includes ALL people from expenses, not just active participants)
            const getBalanceMap = useMemo(() => {
                const balances = new Map();
                // Initialize active participants with 0
                participants.forEach(p => balances.set(p, 0));
                // Process all expenses - this will add removed participants if they have transactions
                expenses.forEach(exp => {
                    const val = parseFloat(exp.amount);
                    if (isNaN(val)) return;
                    // Credit the payer (even if removed)
                    balances.set(exp.payer, (balances.get(exp.payer) || 0) + val);
                    // Debit each beneficiary (even if removed)
                    const split = val / exp.beneficiaries.length;
                    exp.beneficiaries.forEach(b => {
                        balances.set(b, (balances.get(b) || 0) - split);
                    });
                });
                return balances;
            }, [expenses, participants]);

            // Set of active participants (for UI selections)
            const activeParticipantSet = useMemo(() => new Set(participants), [participants]);

            const totalSpent = useMemo(() => expenses.reduce((a, c) => a + c.amount, 0), [expenses]);

            // Formatters (must be defined before useMemo hooks that use them)
            const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
            const formatDate = (date) => new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(date);
            const formatTime = (date) => new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric' }).format(date);

            // Logic: Smart Suggest Next Payer (considers relationships + debt)
            const suggestedPayer = useMemo(() => {
                const debtors = [];
                const creditors = [];

                getBalanceMap.forEach((val, name) => {
                    if (val < -0.01) debtors.push([name, -val]);
                    else if (val > 0.01) creditors.push(name);
                });

                if (debtors.length === 0) {
                    return { person: null, reason: "No current imbalance — anyone can pay next", confidence: "low" };
                }
                if (creditors.length === 0) {
                    return { person: null, reason: "No creditors yet", confidence: "low" };
                }

                // Score each debtor by how many creditors they KNOW (not strangers with)
                const scored = debtors.map(([person, debt]) => {
                    let knownCreditors = 0;
                    for (const creditor of creditors) {
                        const key = [person, creditor].sort().join('|');
                        if (!strangers.has(key)) knownCreditors++;
                    }
                    return {
                        person,
                        debt,
                        knownCreditors,
                        score: knownCreditors / creditors.length
                    };
                });

                // Sort by score (most known creditors), then by debt amount
                scored.sort((a, b) => b.score - a.score || b.debt - a.debt);

                const best = scored[0];
                if (best.score > 0) {
                    return {
                        person: best.person,
                        reason: `Owes ${formatMoney(best.debt)} and knows ${best.knownCreditors}/${creditors.length} creditors`,
                        confidence: best.score > 0.5 ? "high" : "medium"
                    };
                }
                return {
                    person: best.person,
                    reason: `Owes ${formatMoney(best.debt)} but doesn't know current creditors`,
                    confidence: "low"
                };
            }, [getBalanceMap, strangers]);

            const isStranger = useCallback((p1, p2) => {
                const key = [p1, p2].sort().join('|');
                return strangers.has(key);
            }, [strangers]);

            // Logic: Solver
            const settlementPlan = useMemo(() => {
                if (!isSolverLoaded || typeof window.solver === 'undefined') return [];
                
                const balances = getBalanceMap;
                const people = [];
                const netAmounts = {};
                
                balances.forEach((val, name) => {
                    if (Math.abs(val) > 0.01) {
                        people.push(name);
                        netAmounts[name] = Math.round(val * 100);
                    }
                });

                const debtors = people.filter(p => netAmounts[p] < 0);
                const creditors = people.filter(p => netAmounts[p] > 0);

                if (debtors.length === 0 && creditors.length === 0) return [];

                const model = {
                    optimize: "cost",
                    opType: "min",
                    constraints: {},
                    variables: {},
                    ints: {}
                };

                people.forEach(p => model.constraints[p] = { equal: netAmounts[p] });
                const bigM = 10000000;

                debtors.forEach(d => {
                    creditors.forEach(c => {
                        const isS = isStranger(d, c);
                        const cost = isS ? 10000 : 1; 
                        const tVar = `T_${d}_${c}`;
                        const aVar = `A_${d}_${c}`;
                        
                        model.variables[tVar] = { [d]: -1, [c]: 1, [`link_${d}_${c}`]: 1, cost: 0 };
                        model.variables[aVar] = { cost: cost, [`link_${d}_${c}`]: -bigM };
                        model.ints[aVar] = 1;
                        model.constraints[`link_${d}_${c}`] = { max: 0 };
                    });
                });

                try {
                    const res = window.solver.Solve(model);
                    const plan = [];
                    Object.keys(res).forEach(k => {
                        if (k.startsWith("T_") && res[k] > 0) {
                            const [, from, to] = k.split('_');
                            plan.push({ from, to, amount: res[k] / 100, isStranger: isStranger(from, to) });
                        }
                    });
                    return plan;
                } catch (e) { console.error(e); return []; }
            }, [getBalanceMap, strangers, isSolverLoaded, isStranger]);

            // Handlers
            const addParticipant = async () => {
                const name = newParticipant.trim();
                if (name && !participants.includes(name)) {
                    await db.participants.add({ name });
                    setParticipants(prev => [...prev, name]);
                    setSelectedBeneficiaries(prev => new Set(prev).add(name));
                    setNewParticipant('');
                    if (!payer) setPayer(name);
                }
            };

            const removeParticipant = async (name) => {
                // Remove from active participants list (but keep their expenses & relationships frozen)
                await db.participants.delete(name);
                setParticipants(participants.filter(p => p !== name));
                setSelectedBeneficiaries(prev => { const s = new Set(prev); s.delete(name); return s; });

                // DON'T delete stranger relationships - keep them frozen for settlement calculations
                // Stranger relationships are preserved so the solver still routes payments correctly

                if (payer === name && participants.length > 1) {
                    setPayer(participants.find(p => p !== name) || '');
                }
            };

            const toggleStranger = async () => {
                if (!strangerA || !strangerB || strangerA === strangerB) return;
                const key = [strangerA, strangerB].sort().join('|');
                
                if (strangers.has(key)) {
                    await db.strangers.delete(key);
                    setStrangers(prev => { const next = new Set(prev); next.delete(key); return next; });
                } else {
                    await db.strangers.put({ pair: key });
                    setStrangers(prev => { const next = new Set(prev); next.add(key); return next; });
                }
            };

            const removeStrangerPair = async (pair) => {
                await db.strangers.delete(pair);
                setStrangers(prev => { const next = new Set(prev); next.delete(pair); return next; });
            };

            const resetTrip = async () => {
                try {
                    // Close the database connection
                    db.close();
                    // Delete the entire database
                    await Dexie.delete('TripExpenseDB');
                    // Mark that user explicitly reset (stored in localStorage)
                    localStorage.setItem('divvy_user_reset', 'true');
                    // Reload the page to reinitialize
                    window.location.reload();
                } catch (err) {
                    console.error("Failed to reset:", err);
                    alert('Failed to reset trip data: ' + err.message);
                }
            };

            const loadDemoData = async () => {
                try {
                    const defaults = ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'];
                    await db.participants.bulkAdd(defaults.map(name => ({ name })));

                    const demoExpenses = [
                        { payer: 'Alex', amount: 180, description: 'Airbnb (2 nights)', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000) },
                        { payer: 'Jordan', amount: 65, description: 'Grocery run', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 2.5 * 24 * 60 * 60 * 1000) },
                        { payer: 'Sam', amount: 120, description: 'Surf board rentals', beneficiaries: ['Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000) },
                        { payer: 'Riley', amount: 85, description: 'Seafood dinner', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 1.5 * 24 * 60 * 60 * 1000) },
                        { payer: 'Alex', amount: 40, description: 'Beach bonfire supplies', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000) },
                        { payer: 'Morgan', amount: 55, description: 'Breakfast & coffee', beneficiaries: ['Alex', 'Jordan', 'Sam', 'Riley', 'Morgan'], date: new Date(Date.now() - 0.5 * 24 * 60 * 60 * 1000) },
                        { payer: 'Jordan', amount: 30, description: 'Gas money', beneficiaries: ['Alex', 'Jordan', 'Riley'], date: new Date() },
                    ];
                    await db.expenses.bulkAdd(demoExpenses);
                    await db.strangers.add({ pair: 'Jordan|Morgan' });

                    // Clear the reset flag so demo loads properly
                    localStorage.removeItem('divvy_user_reset');
                    // Reload to show demo data
                    window.location.reload();
                } catch (err) {
                    console.error("Failed to load demo:", err);
                    alert('Failed to load demo data');
                }
            };

            const submitExpense = async () => {
                const val = parseFloat(amount);
                if (!payer || isNaN(val) || val <= 0 || selectedBeneficiaries.size === 0) return;
                const newExpense = {
                    payer,
                    amount: val,
                    description: description || 'Untitled',
                    beneficiaries: Array.from(selectedBeneficiaries),
                    date: new Date()
                };
                
                const id = await db.expenses.add(newExpense);
                setExpenses(prev => [{...newExpense, id}, ...prev]);
                setAmount('');
                setDescription('');
                setViewMode('history');
            };

            
            // --- IMPORT / EXPORT LOGIC ---
            
            const downloadTSV = () => {
                // Section 1: Expense History (Readable)
                // Added ISO_TIMESTAMP and ID columns for robust restoration
                let tsv = "EXPENSE HISTORY\n";
                tsv += "Date\tDescription\tPayer\tAmount\tBeneficiaries\tISO_Timestamp\tID\n";

                expenses.forEach(exp => {
                    const dateStr = `${formatDate(exp.date)} ${formatTime(exp.date)}`;
                    const cleanDesc = exp.description.replace(/[\t\n]/g, " ");
                    const benStr = exp.beneficiaries.join(", ");
                    const isoDate = exp.date.toISOString();
                    tsv += `${dateStr}\t${cleanDesc}\t${exp.payer}\t${exp.amount.toFixed(2)}\t${benStr}\t${isoDate}\t${exp.id}\n`;
                });

                tsv += `\nTOTAL SPENT\t${totalSpent.toFixed(2)}\n\n`;

                // Section 2: Participants Dump
                tsv += "PARTICIPANTS_DATA\n";
                tsv += "Name\n";
                participants.forEach(p => tsv += `${p}\n`);
                tsv += "\n";

                // Section 3: Strangers Dump
                tsv += "STRANGERS_DATA\n";
                tsv += "Pair\n";
                strangers.forEach(s => tsv += `${s}\n`);
                tsv += "\n";

                // Section 4: Calculated Plan (For Human Reading Only)
                tsv += "OPTIMIZED SETTLEMENT PLAN\n";
                tsv += "From\tTo\tAmount\tRelationship\n";

                settlementPlan.forEach(plan => {
                    const type = plan.isStranger ? "Stranger Path" : "Direct";
                    tsv += `${plan.from}\t${plan.to}\t${plan.amount.toFixed(2)}\t${type}\n`;
                });

                const blob = new Blob([tsv], { type: "text/tab-separated-values" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `trip_backup_${new Date().toISOString().slice(0,10)}.tsv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const triggerImport = () => {
                fileInputRef.current?.click();
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    
                    let section = 'UNKNOWN';
                    const newExpenses = [];
                    const newParticipants = new Set();
                    const newStrangers = new Set();

                    for (let line of lines) {
                        line = line.trim();
                        if (!line) continue;

                        if (line.startsWith('EXPENSE HISTORY')) { section = 'EXPENSES'; continue; }
                        if (line.startsWith('PARTICIPANTS_DATA')) { section = 'PARTICIPANTS'; continue; }
                        if (line.startsWith('STRANGERS_DATA')) { section = 'STRANGERS'; continue; }
                        if (line.startsWith('OPTIMIZED SETTLEMENT PLAN')) { section = 'PLAN'; continue; }
                        if (line.startsWith('TOTAL SPENT')) continue;
                        
                        // Skip headers
                        if (line.startsWith('Date\t') || line.startsWith('Name') || line.startsWith('Pair') || line.startsWith('From\t')) continue;

                        const cols = line.split('\t');

                        if (section === 'EXPENSES' && cols.length >= 4) {
                            // Format: Date, Desc, Payer, Amount, Beneficiaries, ISO, ID
                            // We prefer ISO timestamp if available (col 5), else fallback to current time (lossy restore)
                            // Note: TSV columns index: 0=DateStr, 1=Desc, 2=Payer, 3=Amount, 4=Benes, 5=ISO, 6=ID
                            const amount = parseFloat(cols[3]);
                            if (!isNaN(amount)) {
                                const isoDate = cols[5];
                                const date = isoDate ? new Date(isoDate) : new Date(); // Fallback if old format
                                const beneficiaries = cols[4] ? cols[4].split(', ') : [];
                                
                                newExpenses.push({
                                    date,
                                    description: cols[1] || 'Imported Expense',
                                    payer: cols[2],
                                    amount,
                                    beneficiaries
                                });
                                // Infer participants just in case
                                newParticipants.add(cols[2]);
                                beneficiaries.forEach(b => newParticipants.add(b));
                            }
                        } else if (section === 'PARTICIPANTS') {
                            newParticipants.add(line);
                        } else if (section === 'STRANGERS') {
                            newStrangers.add(line);
                        }
                    }

                    // Atomic Update
                    try {
                        await db.transaction('rw', db.participants, db.expenses, db.strangers, async () => {
                            await db.participants.clear();

                                                                    {/* Payer & Amount */}
                                                                    <div className="col-span-3 flex flex-col items-end">
                                                                        <span className="text-lg font-bold text-text-main dark:text-white">{formatMoney(exp.amount)}</span>
                                                                        <div className="flex items-center gap-1.5 mt-0.5">
                                                                            <div className={`size-4 rounded-full ${getAvatarColor(exp.payer).bg} flex items-center justify-center`}>
                                                                                <span className={`text-[8px] font-bold ${getAvatarColor(exp.payer).text}`}>{exp.payer.charAt(0)}</span>
                                                                            </div>
                                                                            <span className="text-xs text-slate-500">{exp.payer} paid</span>
                                                                        </div>
                                                                        <span className="text-[10px] text-red-400 font-medium mt-0.5">
                                                                            Split: {formatMoney(exp.amount / exp.beneficiaries.length)} ea.
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* --- Right Column (3) --- */}
                            <div className="lg:col-span-3 flex flex-col gap-6 lg:h-full lg:overflow-hidden">
                                
                                {/* Real-time Balances */}
                                <div className="bg-white dark:bg-[#1a2e22] rounded-xl p-5 border border-[#dce5df] dark:border-white/5 shadow-sm flex-shrink-0">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-lg font-bold tracking-tight text-text-main dark:text-white">Real-time Balances</h2>
                                        <button className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                                            <Icon name="info" className="text-[20px]" />
                                        </button>
                                    </div>
                                    <div className="flex flex-col gap-2 max-h-[250px] overflow-y-auto pr-2">
                                        {Array.from(getBalanceMap).map(([person, val]) => {
                                            const isZero = Math.abs(val) < 0.01;
                                            const isPositive = val > 0;
                                            const isRemoved = !activeParticipantSet.has(person);
                                            const c = getAvatarColor(person);
                                            // Don't show removed participants if they're settled
                                            if (isRemoved && isZero) return null;
                                            return (
                                                <div key={person} className={`flex items-center justify-between p-3 rounded-lg hover:bg-slate-50 dark:hover:bg-white/5 transition-colors group ${isRemoved ? 'opacity-75 border border-dashed border-slate-300 dark:border-slate-600' : ''}`}>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`size-10 rounded-full ${c.bg} ${c.text} flex items-center justify-center font-bold ${isRemoved ? 'grayscale' : ''}`}>{person.charAt(0)}</div>
                                                        <div className="flex flex-col">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-bold text-sm text-text-main dark:text-white">{person}</span>
                                                                {isRemoved && <span className="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400">Left</span>}
                                                            </div>
                                                            <span className={`text-[10px] uppercase font-bold tracking-wide ${isZero ? 'text-slate-400' : isPositive ? 'text-primary' : 'text-red-500'}`}>
                                                                {isZero ? 'Settled' : isPositive ? 'Gets back' : 'Owes'}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <span className={`text-lg font-bold ${isZero ? 'text-slate-300' : isPositive ? 'text-primary' : 'text-red-500'}`}>
                                                        {isPositive ? '+' : ''}{formatMoney(val)}
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Smart Settlement */}
                                <div className="bg-slate-900 text-white rounded-xl p-6 border border-slate-800 shadow-xl lg:flex-1 lg:min-h-0 flex flex-col relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-primary/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none"></div>
                                    <div className="flex items-center gap-2 mb-6 z-10">
                                        <div className="p-2 bg-white/10 rounded-lg">
                                            <Icon name="hub" className="text-primary" />
                                        </div>
                                        <div>
                                            <h2 className="text-lg font-bold tracking-tight text-white">Smart Settlement</h2>
                                            <p className="text-xs text-slate-400">Optimized to minimize transactions</p>
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-4 z-10 flex-1 overflow-y-auto pr-2">
                                        {!isSolverLoaded ? (
                                            <div className="text-center py-10 opacity-50">
                                                <Icon name="sync" className="animate-spin text-2xl mb-2"/>
                                                <p className="text-xs">Loading Optimization Engine...</p>
                                            </div>
                                        ) : settlementPlan.length === 0 ? (
                                            <div className="text-center py-10 opacity-50 flex flex-col items-center">
                                                <div className="size-12 bg-white/10 rounded-full flex items-center justify-center mb-3">
                                                    <Icon name="check" className="text-primary" />
                                                </div>
                                                <p className="text-sm">All settled up!</p>
                                                <p className="text-xs text-slate-500 mt-1">No transactions needed.</p>
                                            </div>
                                        ) : settlementPlan.map((txn, idx) => {
                                            const cFrom = getAvatarColor(txn.from);
                                            const cTo = getAvatarColor(txn.to);
                                            const fromRemoved = !activeParticipantSet.has(txn.from);
                                            const toRemoved = !activeParticipantSet.has(txn.to);
                                            return (
                                                <div key={idx} className="relative bg-white/5 border border-white/10 rounded-xl p-4 flex flex-col gap-3 group hover:bg-white/10 transition-colors">
                                                    <div className="flex items-center gap-4">
                                                        <div className="flex items-center gap-2">
                                                            <div className={`size-8 rounded-full ${cFrom.bg} ${cFrom.text} flex items-center justify-center font-bold text-xs ${fromRemoved ? 'grayscale ring-2 ring-dashed ring-slate-500' : ''}`}>{txn.from.charAt(0)}</div>
                                                            <div className="flex flex-col">
                                                                <span className="font-bold text-sm text-white">{txn.from}</span>
                                                                {fromRemoved && <span className="text-[8px] text-slate-500 uppercase">Left</span>}
                                                            </div>
                                                        </div>
                                                        <div className="flex-1 flex flex-col items-center">
                                                            <div className="w-full h-px bg-white/10 relative">
                                                                <Icon name="arrow_forward" className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-slate-500 text-[16px] bg-slate-900 px-1" />
                                                            </div>
                                                            {txn.isStranger ? (
                                                                <span className="mt-2 bg-red-500/20 text-red-400 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider border border-red-500/20">Stranger Path</span>
                                                            ) : (
                                                                <span className="mt-2 bg-primary/20 text-primary text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider border border-primary/20">Friend</span>
                                                            )}
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <div className={`size-8 rounded-full ${cTo.bg} ${cTo.text} flex items-center justify-center font-bold text-xs ${toRemoved ? 'grayscale ring-2 ring-dashed ring-slate-500' : ''}`}>{txn.to.charAt(0)}</div>
                                                            <div className="flex flex-col">
                                                                <span className="font-bold text-sm text-white">{txn.to}</span>
                                                                {toRemoved && <span className="text-[8px] text-slate-500 uppercase">Left</span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex justify-between items-end mt-1">
                                                        <span className="text-xs text-slate-400">Transfer</span>
                                                        <span className="text-xl font-bold text-primary">{formatMoney(txn.amount)}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-auto flex flex-col gap-2">
                                        <button 
                                            onClick={downloadTSV}
                                            className="w-full py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-sm font-bold transition-colors flex items-center justify-center gap-2"
                                        >
                                            <Icon name="download" className="text-[18px]" />
                                            Download TSV
                                        </button>
                                        <button 
                                            onClick={triggerImport}
                                            className="w-full py-3 bg-transparent hover:bg-white/5 border border-transparent hover:border-white/10 rounded-lg text-sm text-slate-400 hover:text-white font-medium transition-colors flex items-center justify-center gap-2"
                                        >
                                            <Icon name="upload" className="text-[18px]" />
                                            Restore Backup
                                        </button>
                                        {/* Hidden File Input */}
                                        <input 
                                            type="file" 
                                            ref={fileInputRef}
                                            className="hidden" 
                                            accept=".tsv,.txt"
                                            onChange={handleFileUpload}
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
