<body
    class="bg-background-light dark:bg-background-dark text-[#111814] dark:text-white min-h-screen flex flex-col font-display overflow-y-auto">
    <div id="root" class="flex flex-col flex-1"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        // Production flag - set to true in production builds to disable debug logs
        const IS_PRODUCTION = false;

        // --- Advanced Tracing & Logging System ---
        const DivvyTracer = (() => {
            const events = [];
            const maxEvents = 500;
            const sessionId = `session_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
            const sessionStart = Date.now();
            let eventCounter = 0;

            // Active spans for tracking nested function calls
            const activeSpans = new Map();
            let spanIdCounter = 0;

            const levels = { trace: 0, debug: 1, info: 2, warn: 3, error: 4, silent: 999 };
            let currentLevel = IS_PRODUCTION ? levels.silent : levels.debug;

            const getRelativeTime = () => Date.now() - sessionStart;

            const createEvent = (level, category, message, data = null, spanId = null) => {
                const event = {
                    id: ++eventCounter,
                    ts: Date.now(),
                    relativeMs: getRelativeTime(),
                    level,
                    category,
                    message,
                    data,
                    spanId,
                    parentSpanId: spanId ? activeSpans.get(spanId)?.parentId : null
                };

                events.push(event);
                if (events.length > maxEvents) events.shift();

                // Console output with colors
                const colors = {
                    trace: 'color: #9ca3af',
                    debug: 'color: #60a5fa',
                    info: 'color: #34d399',
                    warn: 'color: #fbbf24',
                    error: 'color: #f87171'
                };

                const timeStr = `+${(event.relativeMs / 1000).toFixed(3)}s`;
                const spanStr = spanId ? `[span:${spanId}]` : '';

                if (levels[level] >= currentLevel) {
                    console.log(
                        `%c${timeStr} %c[${level.toUpperCase()}]%c [${category}]${spanStr} ${message}`,
                        'color: #6b7280; font-weight: bold',
                        colors[level],
                        'color: inherit',
                        data || ''
                    );
                }

                return event;
            };

            // Start a span (for tracking function execution)
            const startSpan = (name, category = 'function') => {
                const spanId = `span_${++spanIdCounter}`;
                const parentSpan = Array.from(activeSpans.values()).pop();

                activeSpans.set(spanId, {
                    id: spanId,
                    name,
                    category,
                    startTime: Date.now(),
                    startRelative: getRelativeTime(),
                    parentId: parentSpan?.id || null
                });

                createEvent('debug', category, `→ ${name} started`, null, spanId);

                return {
                    spanId,
                    end: (result = null) => {
                        const span = activeSpans.get(spanId);
                        if (span) {
                            const duration = Date.now() - span.startTime;
                            createEvent('debug', category, `← ${name} completed (${duration}ms)`, result, spanId);
                            activeSpans.delete(spanId);
                        }
                    },
                    error: (err) => {
                        const span = activeSpans.get(spanId);
                        if (span) {
                            const duration = Date.now() - span.startTime;
                            createEvent('error', category, `✗ ${name} failed (${duration}ms)`, { error: err?.message || err }, spanId);
                            activeSpans.delete(spanId);
                        }
                    },
                    log: (level, message, data) => {
                        createEvent(level, category, message, data, spanId);
                    }
                };
            };

            // Track user interactions
            const trackInteraction = (type, target, data = null) => {
                createEvent('info', 'interaction', `🖱️ ${type}: ${target}`, data);
            };

            // Track state changes
            const trackStateChange = (stateName, oldValue, newValue) => {
                createEvent('debug', 'state', `📊 ${stateName} changed`, {
                    from: typeof oldValue === 'object' ? '[object]' : oldValue,
                    to: typeof newValue === 'object' ? '[object]' : newValue
                });
            };

            // Public API
            return {
                sessionId,

                // Log levels
                trace: (cat, msg, data) => createEvent('trace', cat, msg, data),
                debug: (cat, msg, data) => createEvent('debug', cat, msg, data),
                info: (cat, msg, data) => createEvent('info', cat, msg, data),
                warn: (cat, msg, data) => createEvent('warn', cat, msg, data),
                error: (cat, msg, data) => createEvent('error', cat, msg, data),

                // Span tracking
                startSpan,

                // Specialized trackers
                interaction: trackInteraction,
                stateChange: trackStateChange,

                // Set log level
                setLevel: (level) => { currentLevel = levels[level] || levels.debug; },

                // Get all events
                getEvents: () => [...events],

                // Get events as timeline
                getTimeline: () => events.map(e => ({
                    time: `+${(e.relativeMs / 1000).toFixed(3)}s`,
                    level: e.level,
                    category: e.category,
                    message: e.message,
                    data: e.data
                })),

                // Get function call chain
                getCallChain: () => {
                    const spans = events.filter(e => e.message.startsWith('→') || e.message.startsWith('←') || e.message.startsWith('✗'));
                    return spans.map(e => `${e.message}`).join('\n');
                },

                // Filter by category
                filterByCategory: (category) => events.filter(e => e.category === category),

                // Filter by time range (relative ms)
                filterByTimeRange: (startMs, endMs) => events.filter(e => e.relativeMs >= startMs && e.relativeMs <= endMs),

                // Get interactions only
                getInteractions: () => events.filter(e => e.category === 'interaction'),

                // Clear events
                clear: () => { events.length = 0; eventCounter = 0; },

                // Export as JSON
                exportJSON: () => JSON.stringify({
                    sessionId,
                    exportedAt: new Date().toISOString(),
                    sessionDuration: getRelativeTime(),
                    totalEvents: events.length,
                    events
                }, null, 2),

                // Download logs
                download: () => {
                    const blob = new Blob([DivvyTracer.exportJSON()], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `divvy-trace-${sessionId}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                },

                // Pretty print summary
                summary: () => {
                    const byCategory = {};
                    const byLevel = {};
                    events.forEach(e => {
                        byCategory[e.category] = (byCategory[e.category] || 0) + 1;
                        byLevel[e.level] = (byLevel[e.level] || 0) + 1;
                    });
                    console.log('%c📊 Divvy Trace Summary', 'font-size: 14px; font-weight: bold; color: #34d399');
                    console.log(`Session: ${sessionId}`);
                    console.log(`Duration: ${(getRelativeTime() / 1000).toFixed(2)}s`);
                    console.log(`Total Events: ${events.length}`);
                    console.table(byCategory);
                    console.table(byLevel);
                }
            };
        })();

        // Expose globally for console debugging
        window.trace = DivvyTracer;

        // Shorthand logger
        const T = DivvyTracer;

        T.info('app', '🚀 Divvy app initializing...', { sessionId: T.sessionId });

        // --- UUID Helper ---
        const generateId = () =>
            typeof crypto.randomUUID === 'function'
                ? crypto.randomUUID()
                : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                  });

        // --- Google Sheets Config ---
        const GOOGLE_CLIENT_ID = '852208883738-v7kfe15jsq7pgr89ur1b4lvk4d91jr9b.apps.googleusercontent.com';
        const GOOGLE_SCOPES = 'openid profile email https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';

        // --- Dexie Database Setup ---
        const db = new Dexie('TripExpenseDB');
        db.version(1).stores({
            participants: '&name',
            expenses: '++id, date',
            strangers: '&pair'
        });
        db.version(2).stores({
            participants: '&name',
            expenses: 'id, date', // UUID primary key (no auto-increment)
            strangers: '&pair'
        }).upgrade(tx => {
            return tx.table('expenses').toCollection().modify(expense => {
                expense.id = generateId();
            });
        });

        // --- Helpers ---
        const AVATAR_COLORS = [
            { bg: 'bg-indigo-100', text: 'text-indigo-600' },
            { bg: 'bg-pink-100', text: 'text-pink-600' },
            { bg: 'bg-blue-100', text: 'text-blue-600' },
            { bg: 'bg-orange-100', text: 'text-orange-600' },
            { bg: 'bg-emerald-100', text: 'text-emerald-600' },
            { bg: 'bg-purple-100', text: 'text-purple-600' },
        ];

        const getAvatarColor = (name) => {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const index = Math.abs(hash) % AVATAR_COLORS.length;
            return AVATAR_COLORS[index];
        };

        const Icon = ({ name, className = "", filled = false }) => (
            <span className={`material-symbols-outlined ${filled ? 'fill' : ''} ${className}`}>
                {name}
            </span>
        );

        const BenefitItem = ({ icon, title, description }) => (
            <div className="flex items-start gap-3 p-3 rounded-lg hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
                <div className="flex-shrink-0 mt-1">
                    <div className="size-10 rounded-lg bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-primary">
                        <Icon name={icon} className="text-[20px]" />
                    </div>
                </div>
                <div className="flex-1">
                    <h3 className="font-bold text-sm text-text-main dark:text-white mb-0.5">{title}</h3>
                    <p className="text-xs text-slate-600 dark:text-slate-400 leading-snug">{description}</p>
                </div>
            </div>
        );

        const Tooltip = ({ text, children }) => {
            const [show, setShow] = useState(false);
            const [pos, setPos] = useState({ top: 0, left: 0 });
            const triggerRef = useRef(null);

            const handleMouseEnter = () => {
                if (triggerRef.current) {
                    const rect = triggerRef.current.getBoundingClientRect();
                    setPos({
                        top: rect.top - 8,
                        left: rect.left + rect.width / 2
                    });
                }
                setShow(true);
            };

            return (
                <div
                    className="relative inline-block"
                    ref={triggerRef}
                    onMouseEnter={handleMouseEnter}
                    onMouseLeave={() => setShow(false)}
                >
                    {children}
                    {show && (
                        <div
                            className="fixed px-2 py-1 bg-slate-800 text-white text-xs rounded whitespace-nowrap z-[9999] pointer-events-none -translate-x-1/2 -translate-y-full"
                            style={{ top: pos.top, left: pos.left }}
                        >
                            {text}
                            <div className="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-800"></div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Section Card Component with Drag Handle ---
        const SectionCard = ({ id, title, badge, headerRight, className = "", contentClassName = "", children }) => (
            <div id={id} className={`section-card bg-white dark:bg-[#1a2e22] rounded-xl border border-[#dce5df] dark:border-white/5 shadow-sm flex flex-col ${className}`} data-id={id}>
                <div className="flex items-center justify-between p-4 sm:p-5 pb-0 gap-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className="drag-handle p-1 -ml-1 rounded hover:bg-slate-100 dark:hover:bg-white/10 transition-colors cursor-grab active:cursor-grabbing">
                            <Icon name="drag_indicator" className="text-slate-400 dark:text-slate-500 text-[20px]" />
                        </div>
                        <h2 className="text-lg font-bold tracking-tight text-text-main dark:text-white truncate">{title}</h2>
                        {badge !== undefined && (
                            <span className="bg-slate-100 dark:bg-white/10 text-xs font-bold px-2 py-1 rounded-md text-slate-600 dark:text-slate-300 flex-shrink-0">{badge}</span>
                        )}
                    </div>
                    {headerRight && <div className="flex-shrink-0">{headerRight}</div>}
                </div>
                <div className={`p-4 sm:p-5 pt-3 flex-1 ${contentClassName}`}>
                    {children}
                </div>
            </div>
        );

        // --- Main Component ---
        const App = () => {
            // State
            const [isLoading, setIsLoading] = useState(true);
            const [participants, setParticipants] = useState([]);
            const [newParticipant, setNewParticipant] = useState('');
            const [strangers, setStrangers] = useState(new Set()); // "Name1|Name2"
            const [showRelationshipManager, setShowRelationshipManager] = useState(false);
            const [strangerA, setStrangerA] = useState('');
            const [strangerB, setStrangerB] = useState('');

            // Log Expense State
            const [viewMode, setViewMode] = useState('log'); // 'log' | 'history'
            const [expenses, setExpenses] = useState([]);
            const [payer, setPayer] = useState('');
            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [selectedBeneficiaries, setSelectedBeneficiaries] = useState(new Set());

            // Solver
            const [isSolverLoaded, setIsSolverLoaded] = useState(false);

            // Benefits Modal
            const [showBenefitsModal, setShowBenefitsModal] = useState(false);

            // Reset confirmation modal
            const [showResetConfirm, setShowResetConfirm] = useState(false);

            // Google Sheets Sync State
            const [googleUser, setGoogleUser] = useState(null);         // { name, email, picture }
            const [accessToken, setAccessToken] = useState(null);       // OAuth token (in-memory)
            const [sheetId, setSheetId] = useState(() => localStorage.getItem('divvy_sheet_id'));
            const [syncStatus, setSyncStatus] = useState('idle');       // 'idle' | 'syncing' | 'error' | 'success'
            const [lastSynced, setLastSynced] = useState(null);
            const [showJoinTripModal, setShowJoinTripModal] = useState(false);
            const [incomingSheetId, setIncomingSheetId] = useState(null);
            const tokenClientRef = useRef(null);

            // File Input Ref
            const fileInputRef = useRef(null);

            // Sortable container refs
            const leftColumnRef = useRef(null);
            const centerColumnRef = useRef(null);
            const rightColumnRef = useRef(null);

            // Section order state (persisted to localStorage)
            const [sectionOrder, setSectionOrder] = useState(() => {
                const saved = localStorage.getItem('divvy_section_order');
                const defaultOrder = {
                    left: ['participants', 'restrictions'],
                    center: ['expenses'],
                    right: ['balances', 'settlement']
                };
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        T.info('app', 'Restored section order from localStorage', parsed);
                        return parsed;
                    } catch (e) {
                        T.warn('app', 'Failed to parse saved section order', e);
                        return defaultOrder;
                    }
                }
                return defaultOrder;
            });

            // Get all section IDs across all columns
            const getAllSectionIds = () => {
                const allIds = new Set(['participants', 'restrictions', 'expenses', 'balances', 'settlement']);
                return allIds;
            };

            // Ensure all sections are accounted for (in case of missing sections)
            const normalizedSectionOrder = useMemo(() => {
                const allIds = getAllSectionIds();
                const usedIds = new Set([
                    ...sectionOrder.left,
                    ...sectionOrder.center,
                    ...sectionOrder.right
                ]);

                // Find any missing sections and add them to their default column
                const defaults = {
                    participants: 'left',
                    restrictions: 'left',
                    expenses: 'center',
                    balances: 'right',
                    settlement: 'right'
                };

                const normalized = {
                    left: [...sectionOrder.left],
                    center: [...sectionOrder.center],
                    right: [...sectionOrder.right]
                };

                allIds.forEach(id => {
                    if (!usedIds.has(id)) {
                        normalized[defaults[id]].push(id);
                    }
                });

                return normalized;
            }, [sectionOrder]);

            // --- Section Components Map ---
            // Each section is rendered based on its ID
            const renderSection = (sectionId) => {
                switch (sectionId) {
                    case 'participants':
                        return (
                            <div key="participants" className="section-card bg-white dark:bg-[#1a2e22] rounded-xl p-4 sm:p-5 border border-[#dce5df] dark:border-white/5 shadow-sm flex flex-col gap-3 sm:gap-4" data-id="participants">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <div className="drag-handle p-1 -ml-1 rounded hover:bg-slate-100 dark:hover:bg-white/10 transition-colors lg:hidden">
                                            <Icon name="drag_indicator" className="text-slate-400 dark:text-slate-500 text-[20px]" />
                                        </div>
                                        <h2 className="text-lg font-bold tracking-tight text-text-main dark:text-white">Participants</h2>
                                    </div>
                                    <span className="bg-slate-100 dark:bg-white/10 text-xs font-bold px-2 py-1 rounded-md text-slate-600 dark:text-slate-300">{participants.length}</span>
                                </div>
                                <div className="flex flex-col gap-3">
                                    <div className="relative group">
                                        <input
                                            className="w-full bg-[#f6f8f7] dark:bg-black/20 border-none rounded-lg py-3 pl-4 pr-12 text-sm font-medium focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-slate-400 text-text-main dark:text-white"
                                            placeholder="Add new person..."
                                            type="text"
                                            value={newParticipant}
                                            onChange={e => setNewParticipant(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && addParticipant()}
                                        />
                                        {newParticipant.trim() && <button
                                            onClick={addParticipant}
                                            className="absolute right-2 top-1/2 -translate-y-1/2 p-1 bg-white dark:bg-[#2a4032] rounded-md shadow-sm text-primary hover:text-primary-dark transition-colors"
                                        >
                                            <Icon name="add" className="text-[18px]" />
                                        </button>}
                                    </div>
                                    <div className="flex flex-wrap gap-2 max-h-[150px] overflow-y-auto">

                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-sm text-white">{txn.to}</span>
                                                            {toRemoved && <span className="text-[8px] text-slate-500 uppercase">Left</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex justify-between items-end mt-1">
                                                    <span className="text-xs text-slate-400">Transfer</span>

                                                </div>
                                            </div>

                                    })}
                                </div>
                                <div className="mt-auto pt-4 flex flex-col gap-2">
                                    <button
                                        onClick={downloadTSV}

                                    >
                                        <Icon name="download" className="text-[18px]" />
                                        Download TSV
                                    </button>
                                    <button
                                        onClick={triggerImport}
                                        className="w-full py-3 bg-transparent hover:bg-white/5 border border-transparent hover:border-white/10 rounded-lg text-sm text-slate-400 hover:text-white font-medium transition-colors flex items-center justify-center gap-2"
                                    >
                                        <Icon name="upload" className="text-[18px]" />
                                        Restore Backup

                                    <input
                                        type="file"

                                        accept=".tsv,.txt"

                                    />
                                </div>
                            </div>
                        );

                    default:
                        return null;
                }
            };

            useEffect(() => {
                if (typeof window.solver !== 'undefined') setIsSolverLoaded(true);
                else {
                    const i = setInterval(() => {
                        if (typeof window.solver !== 'undefined') {
                            setIsSolverLoaded(true);
                            clearInterval(i);
                        }
                    }, 200);
                    return () => clearInterval(i);
                }
            }, []);

            // Initialize Sortable.js for each column
            useEffect(() => {
                const span = T.startSpan('initSortable', 'sortable');

                // Wait until loading is complete and refs are available
                if (isLoading) {
                    span.log('debug', 'Waiting for app to finish loading...');
                    span.end();
                    return;
                }

                if (typeof Sortable === 'undefined') {
                    span.log('warn', 'Sortable.js not loaded yet');
                    span.end();
                    return;
                }

                // Only enable drag-and-drop on mobile (below lg breakpoint: 1024px)
                const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
                if (isDesktop) {
                    span.log('info', 'Desktop detected - drag-and-drop disabled');
                    span.end();
                    return;
                }

                // Small delay to ensure DOM is fully rendered
                const initTimeout = setTimeout(() => {
                    span.log('info', 'Initializing Sortable.js for all columns...');
                    span.log('debug', 'Checking refs...', {
                        left: !!leftColumnRef.current,
                        center: !!centerColumnRef.current,
                        right: !!rightColumnRef.current
                    });

                    // Debug: Check if section cards exist
                    if (leftColumnRef.current) {
                        const leftCards = leftColumnRef.current.querySelectorAll('.section-card');
                        span.log('debug', `Left column: ${leftCards.length} cards`, Array.from(leftCards).map(c => c.dataset.id));
                    }
                    if (centerColumnRef.current) {
                        const centerCards = centerColumnRef.current.querySelectorAll('.section-card');
                        span.log('debug', `Center column: ${centerCards.length} cards`, Array.from(centerCards).map(c => c.dataset.id));
                    }
                    if (rightColumnRef.current) {
                        const rightCards = rightColumnRef.current.querySelectorAll('.section-card');
                        span.log('debug', `Right column: ${rightCards.length} cards`, Array.from(rightCards).map(c => c.dataset.id));
                    }

                    const sortables = [];
                    const options = {
                        group: 'sections',
                        animation: 150,
                        handle: '.drag-handle',
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        dragClass: 'sortable-drag',
                        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                        forceFallback: true,
                        fallbackTolerance: 3,
                        onStart: (evt) => {
                            const item = evt.item;
                            const fromColumn = evt.from.dataset.column || 'unknown';
                            T.interaction('dragStart', item.dataset.id, {
                                fromColumn,
                                fromIndex: evt.oldIndex
                            });
                        },
                        onMove: (evt) => {
                            const draggedItem = evt.dragged.dataset.id;
                            const targetColumn = evt.to.dataset.column || 'unknown';
                            T.trace('sortable', `Moving ${draggedItem}`, {
                                toColumn: targetColumn,
                                willInsertAfter: evt.related?.dataset?.id || 'start'
                            });
                        },
                        onEnd: (evt) => {
                            const dragSpan = T.startSpan('dragEnd', 'sortable');
                            const item = evt.item;
                            const itemId = item.dataset.id;
                            const fromColumn = evt.from.dataset.column || 'unknown';
                            const toColumn = evt.to.dataset.column || 'unknown';
                            const oldIndex = evt.oldIndex;
                            const newIndex = evt.newIndex;

                            T.interaction('dragEnd', itemId, {
                                fromColumn,
                                toColumn,
                                oldIndex,
                                newIndex,
                                movedToAnotherColumn: fromColumn !== toColumn
                            });

                            // CRITICAL: Revert the DOM move - let React handle DOM updates
                            // This prevents the "removeChild" error caused by DOM/React conflicts
                            if (fromColumn !== toColumn) {
                                // Moved to different column - put it back
                                const fromContainer = evt.from;
                                const toContainer = evt.to;

                                // Remove from new location
                                toContainer.removeChild(item);

                                // Insert back in original location
                                if (fromContainer.children[oldIndex]) {
                                    fromContainer.insertBefore(item, fromContainer.children[oldIndex]);
                                } else {
                                    fromContainer.appendChild(item);
                                }

                                T.debug('sortable', 'Reverted DOM move, React will handle update');
                            } else if (oldIndex !== newIndex) {
                                // Same column but different position - revert
                                const container = evt.from;
                                container.removeChild(item);

                                if (container.children[oldIndex]) {
                                    container.insertBefore(item, container.children[oldIndex]);
                                } else {
                                    container.appendChild(item);
                                }

                                T.debug('sortable', 'Reverted DOM reorder, React will handle update');
                            }

                            // Calculate new order based on the drag operation (not DOM state)
                            setSectionOrder(prevOrder => {
                                const newOrder = {
                                    left: [...prevOrder.left],
                                    center: [...prevOrder.center],
                                    right: [...prevOrder.right]
                                };

                                // Remove from source
                                const sourceArray = newOrder[fromColumn];
                                sourceArray.splice(oldIndex, 1);

                                // Insert at destination
                                const destArray = newOrder[toColumn];
                                destArray.splice(newIndex, 0, itemId);

                                T.info('sortable', 'New section order', newOrder);
                                localStorage.setItem('divvy_section_order', JSON.stringify(newOrder));
                                T.stateChange('sectionOrder', prevOrder, newOrder);

                                return newOrder;
                            });

                            dragSpan.end({ saved: true });
                        }
                    };

                    if (leftColumnRef.current) {
                        leftColumnRef.current.dataset.column = 'left';
                        const sortable = new Sortable(leftColumnRef.current, options);
                        sortables.push(sortable);
                        span.log('debug', '✓ Left column initialized');
                    } else {
                        span.log('warn', '⚠️ Left column ref is null');
                    }
                    if (centerColumnRef.current) {
                        centerColumnRef.current.dataset.column = 'center';
                        const sortable = new Sortable(centerColumnRef.current, options);
                        sortables.push(sortable);
                        span.log('debug', '✓ Center column initialized');
                    } else {
                        span.log('warn', '⚠️ Center column ref is null');
                    }
                    if (rightColumnRef.current) {
                        rightColumnRef.current.dataset.column = 'right';
                        const sortable = new Sortable(rightColumnRef.current, options);
                        sortables.push(sortable);
                        span.log('debug', '✓ Right column initialized');
                    } else {
                        span.log('warn', '⚠️ Right column ref is null');
                    }

                    span.end({ totalInstances: sortables.length });
                    T.info('sortable', `✅ All columns initialized. Total: ${sortables.length}`);

                    // Store sortables for cleanup
                    window._divvySortables = sortables;
                }, 100);

                return () => {
                    clearTimeout(initTimeout);
                    T.debug('sortable', '🧹 Cleaning up Sortable instances...');
                    if (window._divvySortables) {
                        window._divvySortables.forEach(s => s.destroy());
                        window._divvySortables = null;
                    }
                };
            }, [isLoading]);

            // First-load benefits overlay detection
            useEffect(() => {
                const hasSeenBenefits = localStorage.getItem('divvy_has_seen_benefits');
                if (!hasSeenBenefits && participants.length === 0) {
                    setShowBenefitsModal(true);
                    localStorage.setItem('divvy_has_seen_benefits', 'true');
                }
            }, [participants]);

            // ESC key handler for benefits modal
            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key === 'Escape' && showBenefitsModal) {
                        setShowBenefitsModal(false);
                    }
                };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, [showBenefitsModal]);

            // --- Database Loader ---
            const loadDataFromDB = async () => {
                const span = T.startSpan('loadDataFromDB', 'database');
                try {
                    const pCount = await db.participants.count();
                    span.log('debug', `Found ${pCount} participants`);

                    const ps = await db.participants.toArray();
                    const pNames = ps.map(p => p.name);
                    setParticipants(pNames);
                    span.log('debug', `Loaded ${pNames.length} participants`, pNames);

                    if (!payer && pNames.length > 0) setPayer(pNames[0]);
                    setSelectedBeneficiaries(new Set(pNames));

                    const exps = await db.expenses.toArray();
                    setExpenses(exps.sort((a, b) => b.date - a.date));
                    span.log('debug', `Loaded ${exps.length} expenses`);

                    const strs = await db.strangers.toArray();
                    setStrangers(new Set(strs.map(s => s.pair)));
                    span.log('debug', `Loaded ${strs.length} stranger relationships`);

                    span.end({ participants: pNames.length, expenses: exps.length, strangers: strs.length });
                } catch (err) {
                    span.error(err);
                    T.error('database', 'Failed to load DB', { error: err.message });
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadDataFromDB();
            }, []);

            // --- Google Auth & Sheets Sync ---

            // Initialize Google Identity Services token client
            useEffect(() => {
                const initGIS = () => {
                    if (typeof google === 'undefined' || !google.accounts) {
                        // GIS library not loaded yet, retry
                        setTimeout(initGIS, 500);
                        return;
                    }
                    tokenClientRef.current = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: GOOGLE_SCOPES,
                        callback: async (response) => {
                            if (response.access_token) {
                                setAccessToken(response.access_token);
                                try {
                                    const userInfo = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                        headers: { 'Authorization': `Bearer ${response.access_token}` }
                                    });
                                    const info = await userInfo.json();
                                    setGoogleUser({ name: info.name, email: info.email, picture: info.picture });
                                    T.info('auth', 'Google sign-in successful', { email: info.email });
                                } catch (err) {
                                    T.error('auth', 'Failed to fetch user info', { error: err.message });
                                }
                            }
                        },
                    });
                    T.info('auth', 'Google Identity Services initialized');
                };
                initGIS();
            }, []);

            const googleSignIn = () => {
                if (tokenClientRef.current) {
                    tokenClientRef.current.requestAccessToken();
                }
            };

            const googleSignOut = () => {
                if (accessToken) {
                    google.accounts.oauth2.revoke(accessToken);
                }
                setAccessToken(null);
                setGoogleUser(null);
                T.info('auth', 'Google signed out');
            };

            // --- Google Sheets API Helpers ---

            const sheetsApi = async (path, options = {}) => {
                const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${path}`, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                        ...options.headers,
                    },
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `Sheets API error: ${res.status}`);
                }
                return res.json();
            };

            const driveApi = async (path, options = {}) => {
                const res = await fetch(`https://www.googleapis.com/drive/v3/${path}`, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                        ...options.headers,
                    },
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `Drive API error: ${res.status}`);
                }
                return res.json();
            };

            const createTripSheet = async () => {
                T.info('sheets', 'Creating new trip sheet...');
                const span = T.startSpan('createTripSheet', 'sheets');

                // Create spreadsheet with 3 tabs
                const sheet = await sheetsApi('', {
                    method: 'POST',
                    body: JSON.stringify({
                        properties: { title: `${new Date().toISOString().slice(0, 16).replace('T', ' ')} Divvy Trip Expenses` },
                        sheets: [
                            { properties: { title: 'Expenses', index: 0 } },
                            { properties: { title: 'Participants', index: 1 } },
                            { properties: { title: 'Strangers', index: 2 } }
                        ]
                    })
                });

                const newSheetId = sheet.spreadsheetId;

                // Write headers to each tab
                await sheetsApi(`${newSheetId}/values:batchUpdate`, {
                    method: 'POST',
                    body: JSON.stringify({
                        valueInputOption: 'RAW',
                        data: [
                            { range: 'Expenses!A1:H1', values: [['ID', 'Date', 'Description', 'Payer', 'Amount', 'Beneficiaries', 'LastModified', 'Deleted']] },
                            { range: 'Participants!A1', values: [['Name']] },
                            { range: 'Strangers!A1', values: [['Pair']] }
                        ]
                    })
                });

                // Make publicly editable (anyone with link can edit)
                await driveApi(`files/${newSheetId}/permissions`, {
                    method: 'POST',
                    body: JSON.stringify({ role: 'writer', type: 'anyone' })
                });

                setSheetId(newSheetId);
                localStorage.setItem('divvy_sheet_id', newSheetId);

                span.end({ sheetId: newSheetId });
                T.info('sheets', 'Trip sheet created', { sheetId: newSheetId });
                return newSheetId;
            };

            const disconnectSheet = () => {
                setSheetId(null);
                localStorage.removeItem('divvy_sheet_id');
                setSyncStatus('idle');
                setLastSynced(null);
                T.info('sheets', 'Disconnected from sheet');
            };

            // --- Sync Logic (LWW Timestamp-Based Merge) ---

            const expenseToRow = (e) => [
                e.id,
                e.date instanceof Date ? e.date.toISOString() : e.date,
                e.description,
                e.payer,
                e.amount,
                Array.isArray(e.beneficiaries) ? e.beneficiaries.join(',') : e.beneficiaries,
                e.lastModified || new Date().toISOString(),
                e.deleted ? 'true' : 'false'
            ];

            const rowToExpense = (row) => ({
                id: row[0],
                date: new Date(row[1]),
                description: row[2] || 'Imported',
                payer: row[3],
                amount: parseFloat(row[4]),
                beneficiaries: row[5] ? row[5].split(',') : [],
                lastModified: row[6] || new Date().toISOString(),
                deleted: row[7] === 'true'
            });

            const pushToSheet = async (targetSheetId) => {
                const sid = targetSheetId || sheetId;

                // Read fresh from DB (not stale React state)
                const localExpenses = await db.expenses.toArray();
                const localParticipants = (await db.participants.toArray()).map(p => p.name);
                const localStrangers = (await db.strangers.toArray()).map(s => s.pair);

                // Read all sheet expenses
                const sheetExpenseMap = new Map();
                try {
                    const data = await sheetsApi(`${sid}/values/Expenses!A:H`);
                    if (data.values) {
                        data.values.slice(1).forEach((row, idx) => {
                            if (row[0]) sheetExpenseMap.set(row[0], { row, rowIndex: idx + 2 }); // +2: 1-indexed + header
                        });
                    }
                } catch (e) {
                    // Sheet might be empty
                }

                const toAppend = [];
                const toUpdate = [];

                for (const exp of localExpenses) {
                    const sheetEntry = sheetExpenseMap.get(exp.id);
                    if (!sheetEntry) {
                        // New expense: append
                        toAppend.push(expenseToRow(exp));
                    } else {
                        // Exists in both: LWW — local wins if newer
                        const sheetModified = sheetEntry.row[6] || '';
                        const localModified = exp.lastModified || '';
                        if (localModified > sheetModified) {
                            toUpdate.push({ rowIndex: sheetEntry.rowIndex, data: expenseToRow(exp) });
                        }
                    }
                }

                // Append new expenses
                if (toAppend.length > 0) {
                    await sheetsApi(`${sid}/values/Expenses!A:H:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
                        method: 'POST',
                        body: JSON.stringify({ values: toAppend })
                    });
                }

                // Update modified expenses (batch update)
                if (toUpdate.length > 0) {
                    await sheetsApi(`${sid}/values:batchUpdate`, {
                        method: 'POST',
                        body: JSON.stringify({
                            valueInputOption: 'RAW',
                            data: toUpdate.map(u => ({
                                range: `Expenses!A${u.rowIndex}:H${u.rowIndex}`,
                                values: [u.data]
                            }))
                        })
                    });
                }

                // Full replace for participants and strangers (small data sets, union on pull)
                await sheetsApi(`${sid}/values/Participants!A:A?valueInputOption=RAW`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        values: [['Name'], ...localParticipants.map(p => [p])]
                    })
                });

                await sheetsApi(`${sid}/values/Strangers!A:A?valueInputOption=RAW`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        values: [['Pair'], ...localStrangers.map(s => [s])]
                    })
                });

                T.info('sync', `Pushed ${toAppend.length} new, ${toUpdate.length} updated expenses to sheet`);
            };

            const pullFromSheet = async (targetSheetId) => {
                const sid = targetSheetId || sheetId;

                // Read fresh from DB (not stale React state)
                const localExpenses = await db.expenses.toArray();
                const localExpenseMap = new Map(localExpenses.map(e => [e.id, e]));

                // Read all sheet expenses
                const expData = await sheetsApi(`${sid}/values/Expenses!A:H`);
                let addedCount = 0;
                let updatedCount = 0;

                if (expData.values) {
                    for (const row of expData.values.slice(1)) {
                        if (!row[0]) continue;
                        const sheetExp = rowToExpense(row);
                        const localExp = localExpenseMap.get(sheetExp.id);

                        if (!localExp) {
                            // New from sheet: add locally
                            await db.expenses.add(sheetExp);
                            addedCount++;
                        } else {
                            // Exists in both: LWW — sheet wins if newer
                            const sheetModified = sheetExp.lastModified || '';
                            const localModified = localExp.lastModified || '';
                            if (sheetModified > localModified) {
                                await db.expenses.put(sheetExp);
                                updatedCount++;
                            }
                        }
                    }
                }

                // Merge participants (union)
                const localParticipants = new Set((await db.participants.toArray()).map(p => p.name));
                const partData = await sheetsApi(`${sid}/values/Participants!A:A`);
                const newParticipants = [];
                if (partData.values) {
                    partData.values.slice(1).forEach(row => {
                        if (row[0] && !localParticipants.has(row[0])) {
                            newParticipants.push(row[0]);
                        }
                    });
                }
                if (newParticipants.length > 0) {
                    await db.participants.bulkAdd(newParticipants.map(name => ({ name })));
                }

                // Merge strangers (union)
                const localStrangers = new Set((await db.strangers.toArray()).map(s => s.pair));
                const strData = await sheetsApi(`${sid}/values/Strangers!A:A`);
                const newStrangerPairs = [];
                if (strData.values) {
                    strData.values.slice(1).forEach(row => {
                        if (row[0] && !localStrangers.has(row[0])) {
                            newStrangerPairs.push(row[0]);
                        }
                    });
                }
                if (newStrangerPairs.length > 0) {
                    await db.strangers.bulkAdd(newStrangerPairs.map(pair => ({ pair })));
                }

                T.info('sync', `Pulled ${addedCount} new, ${updatedCount} updated expenses, ${newParticipants.length} participants, ${newStrangerPairs.length} strangers`);

                // Reload UI from DB
                await loadDataFromDB();
            };

            const syncWithSheet = async () => {
                if (!accessToken || !sheetId) return;
                setSyncStatus('syncing');
                const span = T.startSpan('syncWithSheet', 'sync');
                try {
                    await pullFromSheet();
                    await pushToSheet();
                    setLastSynced(new Date());
                    setSyncStatus('success');
                    span.end({ success: true });
                    // Fade back to idle after 3s
                    setTimeout(() => setSyncStatus(prev => prev === 'success' ? 'idle' : prev), 3000);
                } catch (err) {
                    setSyncStatus('error');
                    span.error(err);
                    T.error('sync', 'Sync failed', { error: err.message });
                    alert('Sync failed: ' + err.message);
                }
            };

            // --- Sharing ---

            const shareTrip = async () => {
                if (!sheetId) return;
                const shareUrl = `${window.location.origin}${window.location.pathname}#trip=${sheetId}`;

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Join my Divvy trip',
                            text: 'Track and split expenses together',
                            url: shareUrl
                        });
                        T.info('share', 'Trip shared via Web Share API');
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            T.error('share', 'Share failed', { error: err.message });
                        }
                    }
                } else {
                    try {
                        await navigator.clipboard.writeText(shareUrl);
                        alert('Share link copied to clipboard!');
                        T.info('share', 'Trip link copied to clipboard');
                    } catch (err) {
                        // Fallback: show URL in prompt
                        prompt('Copy this link to share:', shareUrl);
                    }
                }
            };

            // Detect #trip=SHEET_ID on app load
            useEffect(() => {
                const checkTripHash = () => {
                    const hash = window.location.hash;
                    if (hash.startsWith('#trip=')) {
                        const incoming = hash.slice(6);
                        window.history.replaceState(null, '', window.location.pathname);
                        if (incoming && incoming !== sheetId) {
                            setIncomingSheetId(incoming);
                            setShowJoinTripModal(true);
                        } else if (incoming && incoming === sheetId) {
                            T.info('share', 'Already connected to this trip sheet');
                        }
                    }
                };
                checkTripHash();
                window.addEventListener('hashchange', checkTripHash);
                return () => window.removeEventListener('hashchange', checkTripHash);
            }, [sheetId]);

            // Auto-sync when app becomes visible or on initial auth
            useEffect(() => {
                if (!accessToken || !sheetId) return;

                // Sync once on initial connect (e.g. returning user opens app)
                syncWithSheet();

                const handleVisibility = () => {
                    if (document.visibilityState === 'visible') {
                        T.info('sync', 'App became visible, auto-syncing...');
                        syncWithSheet();
                    }
                };
                document.addEventListener('visibilitychange', handleVisibility);
                return () => document.removeEventListener('visibilitychange', handleVisibility);
            }, [accessToken, sheetId]);

            const joinTrip = async () => {
                const joiningSheetId = incomingSheetId;
                setSheetId(joiningSheetId);
                localStorage.setItem('divvy_sheet_id', joiningSheetId);
                setShowJoinTripModal(false);
                setIncomingSheetId(null);

                if (accessToken) {
                    setSyncStatus('syncing');
                    try {
                        // Full replace: clear local data before pulling from sheet
                        await db.transaction('rw', db.participants, db.expenses, db.strangers, async () => {
                            await db.participants.clear();
                            await db.expenses.clear();
                            await db.strangers.clear();
                        });
                        T.info('sync', 'Cleared local data before joining trip');

                        await pullFromSheet(joiningSheetId);
                        setLastSynced(new Date());
                        setSyncStatus('success');
                        setTimeout(() => setSyncStatus(prev => prev === 'success' ? 'idle' : prev), 3000);
                    } catch (err) {
                        setSyncStatus('error');
                        T.error('sync', 'Failed to pull after joining trip', { error: err.message });
                    }
                }
            };

            // Auto-create sheet & push on "Create Shared Trip"
            const createAndShareTrip = async () => {
                try {
                    const newId = await createTripSheet();
                    await pushToSheet(newId);
                    setLastSynced(new Date());
                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus(prev => prev === 'success' ? 'idle' : prev), 3000);
                } catch (err) {
                    T.error('sheets', 'Failed to create trip sheet', { error: err.message });
                    alert('Failed to create shared trip: ' + err.message);
                }
            };

            // Sync status helper for display
            const getSyncLabel = () => {
                if (syncStatus === 'syncing') return 'Syncing...';
                if (syncStatus === 'error') return 'Sync failed';
                if (syncStatus === 'success') return 'Synced!';
                if (lastSynced) {
                    const mins = Math.floor((Date.now() - lastSynced.getTime()) / 60000);
                    if (mins < 1) return 'Synced just now';
                    return `Synced ${mins}m ago`;
                }
                return 'Sync';
            };

            // Filter out soft-deleted expenses for UI
            const visibleExpenses = useMemo(() => expenses.filter(e => !e.deleted), [expenses]);

            // Logic: Balance Calculation (includes ALL people from expenses, not just active participants)
            const getBalanceMap = useMemo(() => {
                const balances = new Map();
                // Initialize active participants with 0
                participants.forEach(p => balances.set(p, 0));
                // Process only visible (non-deleted) expenses
                visibleExpenses.forEach(exp => {
                    const val = parseFloat(exp.amount);
                    if (isNaN(val)) return;
                    // Credit the payer (even if removed)
                    balances.set(exp.payer, (balances.get(exp.payer) || 0) + val);
                    // Debit each beneficiary (even if removed)
                    const split = val / exp.beneficiaries.length;
                    exp.beneficiaries.forEach(b => {
                        balances.set(b, (balances.get(b) || 0) - split);
                    });
                });
                return balances;
            }, [visibleExpenses, participants]);

            // Set of active participants (for UI selections)
            const activeParticipantSet = useMemo(() => new Set(participants), [participants]);

            const totalSpent = useMemo(() => visibleExpenses.reduce((a, c) => a + c.amount, 0), [visibleExpenses]);

            // Formatters (must be defined before useMemo hooks that use them)
            const formatMoney = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
            const formatDate = (date) => new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(date);
            const formatTime = (date) => new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: 'numeric' }).format(date);

            // Logic: Smart Suggest Next Payer (considers relationships + debt)
            const suggestedPayer = useMemo(() => {
                const debtors = [];
                const creditors = [];

                getBalanceMap.forEach((val, name) => {
                    if (val < -0.01) debtors.push([name, -val]);
                    else if (val > 0.01) creditors.push(name);
                });

                if (debtors.length === 0) {
                    return { person: null, reason: "No current imbalance — anyone can pay next", confidence: "low" };
                }
                if (creditors.length === 0) {
                    return { person: null, reason: "No creditors yet", confidence: "low" };
                }

                // Score each debtor by how many creditors they KNOW (not strangers with)
                const scored = debtors.map(([person, debt]) => {
                    let knownCreditors = 0;
                    for (const creditor of creditors) {
                        const key = [person, creditor].sort().join('|');
                        if (!strangers.has(key)) knownCreditors++;
                    }
                    return {
                        person,
                        debt,
                        knownCreditors,
                        score: knownCreditors / creditors.length
                    };
                });

                // Sort by score (most known creditors), then by debt amount
                scored.sort((a, b) => b.score - a.score || b.debt - a.debt);

                const best = scored[0];
                if (best.score > 0) {
                    return {
                        person: best.person,
                        reason: `Owes ${formatMoney(best.debt)} and knows ${best.knownCreditors}/${creditors.length} creditors`,
                        confidence: best.score > 0.5 ? "high" : "medium"
                    };
                }
                return {
                    person: best.person,
                    reason: `Owes ${formatMoney(best.debt)} but doesn't know current creditors`,
                    confidence: "low"
                };
            }, [getBalanceMap, strangers]);

            const isStranger = useCallback((p1, p2) => {
                const key = [p1, p2].sort().join('|');
                return strangers.has(key);
            }, [strangers]);

            // Logic: Solver
            const settlementPlan = useMemo(() => {
                if (!isSolverLoaded || typeof window.solver === 'undefined') return [];

                const balances = getBalanceMap;
                const people = [];
                const netAmounts = {};

                balances.forEach((val, name) => {
                    if (Math.abs(val) > 0.01) {
                        people.push(name);
                        netAmounts[name] = Math.round(val * 100);
                    }
                });

                const debtors = people.filter(p => netAmounts[p] < 0);
                const creditors = people.filter(p => netAmounts[p] > 0);

                if (debtors.length === 0 && creditors.length === 0) return [];

                const model = {
                    optimize: "cost",
                    opType: "min",
                    constraints: {},
                    variables: {},
                    ints: {}
                };

                people.forEach(p => model.constraints[p] = { equal: netAmounts[p] });
                const bigM = 10000000;

                debtors.forEach(d => {
                    creditors.forEach(c => {
                        const isS = isStranger(d, c);
                        const cost = isS ? 10000 : 1;
                        const tVar = `T_${d}_${c}`;
                        const aVar = `A_${d}_${c}`;

                        model.variables[tVar] = { [d]: -1, [c]: 1, [`link_${d}_${c}`]: 1, cost: 0 };
                        model.variables[aVar] = { cost: cost, [`link_${d}_${c}`]: -bigM };
                        model.ints[aVar] = 1;
                        model.constraints[`link_${d}_${c}`] = { max: 0 };
                    });
                });

                try {
                    const res = window.solver.Solve(model);
                    const plan = [];
                    Object.keys(res).forEach(k => {
                        if (k.startsWith("T_") && res[k] > 0) {
                            const [, from, to] = k.split('_');
                            plan.push({ from, to, amount: res[k] / 100, isStranger: isStranger(from, to) });
                        }
                    });
                    return plan;
                } catch (e) { console.error(e); return []; }
            }, [getBalanceMap, strangers, isSolverLoaded, isStranger]);

            // Handlers
            const addParticipant = async () => {
                const name = newParticipant.trim();

                        await db.participants.add({ name });
                        setParticipants(prev => [...prev, name]);
                        setSelectedBeneficiaries(prev => new Set(prev).add(name));
                        setNewParticipant('');
                        if (!payer) setPayer(name);
                        span.end({ name, totalParticipants: participants.length + 1 });
                    } catch (err) {
                        span.error(err);
                    }
                }
            };

            const removeParticipant = async (name) => {
                T.interaction('removeParticipant', name);
                const span = T.startSpan('removeParticipant', 'participant');
                try {
                    await db.participants.delete(name);
                    setParticipants(participants.filter(p => p !== name));
                    setSelectedBeneficiaries(prev => { const s = new Set(prev); s.delete(name); return s; });

                    if (payer === name && participants.length > 1) {
                        setPayer(participants.find(p => p !== name) || '');

                    span.end({ removed: name, remaining: participants.length - 1 });
                } catch (err) {
                    span.error(err);
                }
            };

            const toggleStranger = async () => {
                if (!strangerA || !strangerB || strangerA === strangerB) return;
                const key = [strangerA, strangerB].sort().join('|');
                T.interaction('toggleStranger', key);
                const span = T.startSpan('toggleStranger', 'relationship');

                try {
                    if (strangers.has(key)) {
                        await db.strangers.delete(key);
                        setStrangers(prev => { const next = new Set(prev); next.delete(key); return next; });
                        span.end({ action: 'removed', pair: key });
                    } else {
                        await db.strangers.put({ pair: key });
                        setStrangers(prev => { const next = new Set(prev); next.add(key); return next; });
                        span.end({ action: 'added', pair: key });
                    }
                } catch (err) {
                    span.error(err);
                }
            };

            const removeStrangerPair = async (pair) => {
                T.interaction('removeStrangerPair', pair);
                const span = T.startSpan('removeStrangerPair', 'relationship');
                try {
                    await db.strangers.delete(pair);
                    setStrangers(prev => { const next = new Set(prev); next.delete(pair); return next; });

            const resetTrip = async () => {

                    localStorage.removeItem('divvy_sheet_id');

                } catch (err) {
                    span.error(err);
                    T.error('database', 'Failed to reset trip', { error: err.message });

            const loadDemoData = async () => {

                const span = T.startSpan('loadDemoData', 'database');
                try {
